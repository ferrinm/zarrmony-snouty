repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-internal-paths
        name: no internal dataset paths or identifiers
        entry: python scripts/check_no_internal_paths.py
        language: system
        pass_filenames: true
        # No `exclude` here. The checker, its tests and the convention doc all
        # name the patterns they exist to catch, so every rule fires on them.
        # The checker skips those three itself, in `SELF_DESCRIBING`. CI runs
        # the same checker over `git ls-files`, and the two callers must agree
        # about which files are exempt (#59).
