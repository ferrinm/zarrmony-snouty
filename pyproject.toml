[project]
name = "zarrmony-snouty"
version = "0.3.2"
description = "Snouty (AndrewGYork single-objective light-sheet) reader plugin for zarrmony."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Max Ferrin", email = "ferrin@calicolabs.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # 0.9.0 was the floor for the HCS plate API (PlateLayout, PlateField,
    # Acquisition) that the plate reader populates.
    #
    # 0.15.0 is the floor now, because that release added
    # ``zarrmony.errors.ReaderKwargError``. Every plugin ``open`` here raises
    # a subclass of it to reject a reader kwarg (#42), and the import is at
    # module scope, so an older zarrmony cannot import this package.
    #
    # Nothing is lost below 0.15.0. ``reader_kwargs`` forwarding arrived in
    # 0.13.0, so 0.9.0 through 0.12.0 could never reach the plugin ``open``
    # with a reader kwarg at all. 0.13.0 and 0.14.0 could, and had no error
    # type the CLI turns into a message.
    "zarrmony>=0.15.0",
    # The reader builds the OME object zarrmony reads per scene (#39).
    # zarrmony pulls ome-types in too, but this package imports it directly,
    # so it declares it directly.
    #
    # 0.6.3 is the floor because it is what zarrmony 0.18 asks for and what
    # this reader is tested against. No older release was tested, so the
    # floor claims nothing about one.
    #
    # The zarrmony floor stays below 0.18.1 on purpose. Only 0.18.1 reads
    # ``ome_metadata``, and an unused property is harmless on anything older.
    "ome-types>=0.6.3",
    "tifffile>=2024.0",
    "dask>=2026.3.0",
    "numpy>=2",
    "scipy>=1.13",
    "xarray>=2025.9.0",
]

[project.entry-points."zarrmony.readers"]
snouty = "zarrmony_snouty:plugin"
snouty-session = "zarrmony_snouty:session_plugin"
snouty-plate = "zarrmony_snouty:plate_plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.14",
    "pre-commit>=4",
    # tests/test_reader_kwargs.py drives the real `zarrmony convert` CLI
    # through click's CliRunner, because the error type only pays off inside
    # the CLI (#42). zarrmony pulls click in too, but the tests import it
    # directly, so it is declared directly.
    "click>=8",
    # tests/test_sdist_contents.py builds an sdist in process and reads the
    # member list (#58). hatchling is already the build backend, so this
    # pins no new tool — it only puts the backend in the test environment.
    "hatchling>=1.27",
]

[project.urls]
Homepage = "https://github.com/ferrinm/zarrmony-snouty"
Issues = "https://github.com/ferrinm/zarrmony-snouty/issues"
Changelog = "https://github.com/ferrinm/zarrmony-snouty/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarrmony_snouty"]

[tool.hatch.build.targets.sdist]
# An allow-list, not a deny-list (#58). hatchling keeps every file a VCS does
# not ignore, and a working tree holds untracked state that `.gitignore` does
# not name — `.claude/` with session settings and whole worktree copies,
# `.envrc`. A deny-list ships each of those until somebody notices, and a
# distribution is the hardest place to retract a file from. Under an
# allow-list, a new untracked directory is out by default.
#
# The list reproduces the published 0.3.2 sdist. Two things stay out on
# purpose. `docs` describes internal consumers from time to time.
# `.out-of-scope` is triage knowledge: it records why a request was refused,
# which is a maintainer note rather than something a downstream installer
# needs.
#
# Every pattern is anchored with a leading `/`. hatchling reads these as
# gitignore patterns, and an unanchored `src` matches a directory of that
# name at any depth. A worktree under `.claude/` has its own `src`, `tests`
# and `pyproject.toml`, so an unanchored list ships the whole copy and
# defeats the point of the allow-list.
#
# `tests/test_sdist_contents.py` pins the result. Change the list and that
# test together.
include = [
    "/src",
    "/tests",
    "/scripts",
    "/.github",
    "/.gitignore",
    "/.pre-commit-config.yaml",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/CONTEXT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.format]
# ruff 0.16 formats python code blocks inside Markdown. The ADRs quote vendor
# code and vendor filenames verbatim, so a formatter that rewrites their quote
# style rewrites the evidence. Format python files only.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
filterwarnings = [
    # zarrmony raises this when a soft-optional reader surface fails, and it
    # also writes the failure into the store it is converting. A convert that
    # warns ships a degraded store, so the suite treats it as an error (#39).
    #
    # Gated on this one category, not on UserWarning. This plugin raises
    # SnoutyTimestampWarning, SnoutyPlateFormatWarning and two session
    # warnings deliberately, and several tests assert on them.
    "error::zarrmony.errors.ExtractorWarning",
]
markers = [
    "gpu: needs a CUDA device and cupy; skipped on a CPU-only host",
]
