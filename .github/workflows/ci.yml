name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install zarrmony-snouty and dev tools
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check

      - name: Format check
        run: .venv/bin/ruff format --check

      # The same checker that `.pre-commit-config.yaml` runs. A contributor who
      # clones and pushes without `pre-commit install` gets no hook, so without
      # this step every rule in the checker is advisory (#59). `xargs` exits
      # non-zero if any batch does, so a finding in any file fails the job.
      - name: No internal paths
        run: git ls-files -z | xargs -0 .venv/bin/python scripts/check_no_internal_paths.py

      - name: Test
        run: .venv/bin/pytest
