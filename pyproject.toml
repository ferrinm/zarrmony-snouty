[project]
name = "zarrmony-snouty"
version = "0.3.1"
description = "Snouty (AndrewGYork single-objective light-sheet) reader plugin for zarrmony."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Max Ferrin", email = "ferrin@calicolabs.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # 0.9.0 was the floor for the HCS plate API (PlateLayout, PlateField,
    # Acquisition) that the plate reader populates.
    #
    # 0.15.0 is the floor now, because that release added
    # ``zarrmony.errors.ReaderKwargError``. Every plugin ``open`` here raises
    # a subclass of it to reject a reader kwarg (#42), and the import is at
    # module scope, so an older zarrmony cannot import this package.
    #
    # Nothing is lost below 0.15.0. ``reader_kwargs`` forwarding arrived in
    # 0.13.0, so 0.9.0 through 0.12.0 could never reach the plugin ``open``
    # with a reader kwarg at all. 0.13.0 and 0.14.0 could, and had no error
    # type the CLI turns into a message.
    "zarrmony>=0.15.0",
    # The reader builds the OME object zarrmony reads per scene (#39).
    # zarrmony pulls ome-types in too, but this package imports it directly,
    # so it declares it directly.
    #
    # 0.6.3 is the floor because it is what zarrmony 0.18 asks for and what
    # this reader is tested against. No older release was tested, so the
    # floor claims nothing about one.
    #
    # The zarrmony floor is lower than 0.18 on purpose. A zarrmony before
    # 0.18.1 never reads ``ome_metadata``, and an unused property is
    # harmless there.
    "ome-types>=0.6.3",
    "tifffile>=2024.0",
    "dask>=2026.3.0",
    "numpy>=2",
    "scipy>=1.13",
    "xarray>=2025.9.0",
]

[project.entry-points."zarrmony.readers"]
snouty = "zarrmony_snouty:plugin"
snouty-session = "zarrmony_snouty:session_plugin"
snouty-plate = "zarrmony_snouty:plate_plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.14",
    "pre-commit>=4",
]

[project.urls]
Homepage = "https://github.com/ferrinm/zarrmony-snouty"
Issues = "https://github.com/ferrinm/zarrmony-snouty/issues"
Changelog = "https://github.com/ferrinm/zarrmony-snouty/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarrmony_snouty"]

[tool.hatch.build.targets.sdist]
# Keep documentation out of the published sdist. The docs describe internal
# consumers from time to time, and a distribution is the hardest place to
# retract a file from.
exclude = ["docs"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.format]
# ruff 0.16 formats python code blocks inside Markdown. The ADRs quote vendor
# code and vendor filenames verbatim, so a formatter that rewrites their quote
# style rewrites the evidence. Format python files only.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
filterwarnings = [
    # zarrmony raises this when a soft-optional reader surface fails, and it
    # also writes the failure into the store it is converting. A convert that
    # warns ships a degraded store, so the suite treats it as an error (#39).
    #
    # Gated on this one category, not on UserWarning. This plugin raises
    # SnoutyTimestampWarning, SnoutyPlateFormatWarning and two session
    # warnings deliberately, and several tests assert on them.
    "error::zarrmony.errors.ExtractorWarning",
]
markers = [
    "gpu: needs a CUDA device and cupy; skipped on a CPU-only host",
]
